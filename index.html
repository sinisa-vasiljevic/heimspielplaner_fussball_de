<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heimspielplaner index.html korrigieren</title>
<style>
body{font-family:system-ui,Arial;max-width:720px;margin:40px auto;padding:0 16px;background:#eef2f7;color:#0f172a}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 3px 14px #0f172a18}button,label{display:block;width:100%;box-sizing:border-box}label{padding:14px;border:2px dashed #94a3b8;border-radius:12px;text-align:center;font-weight:700;cursor:pointer}input{display:none}button{margin-top:14px;padding:13px;border:0;border-radius:11px;background:#0759b8;color:white;font-weight:800}button:disabled{opacity:.45}.status{margin-top:14px;padding:11px;border-radius:10px;background:#e0f2fe}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}</style>
</head>
<body>
<div class="card">
<h1>Korrigierte index.html erzeugen</h1>
<p>Die aktuelle <b>index.html</b> auswählen. Das Werkzeug ändert ausschließlich die Herren-Kollisionslogik und lädt danach sofort die vollständige korrigierte <b>index.html</b> herunter.</p>
<label>Aktuelle index.html auswählen<input id="file" type="file" accept=".html,text/html"></label>
<button id="run" disabled>Korrigierte index.html herunterladen</button>
<div id="status" class="status">Noch keine Datei ausgewählt.</div>
</div>
<script>
'use strict';
let source='',name='';
const file=document.getElementById('file'),run=document.getElementById('run'),status=document.getElementById('status');
file.onchange=async()=>{
 const f=file.files&&file.files[0]; if(!f)return;
 source=await f.text(); name=f.name;
 const old="if(isMenGame(x)||isMenGame(y)){mark(x,'Herrenspiel überschneidet sich');mark(y,'Herrenspiel überschneidet sich');continue}var px=pitchKey(x),py=pitchKey(y);if(px==='unbekannt'||py==='unbekannt'){mark(x,'Platzangabe fehlt');mark(y,'Platzangabe fehlt')}else if(px===py){mark(x,'Gleicher Platz überschneidet sich');mark(y,'Gleicher Platz überschneidet sich')}";
 if(name.toLowerCase()!=='index.html'){
  status.className='status bad';status.textContent='Bitte die Datei index.html auswählen.';run.disabled=true;return;
 }
 if(!source.includes(old)){
  status.className='status bad';status.textContent='Die erwartete Kollisionsfunktion wurde nicht exakt gefunden. Es wurde nichts verändert.';run.disabled=true;return;
 }
 status.className='status ok';status.textContent='Datei geprüft. Genau eine passende Kollisionsstelle gefunden.';run.disabled=false;
};
run.onclick=()=>{
 const old="if(isMenGame(x)||isMenGame(y)){mark(x,'Herrenspiel überschneidet sich');mark(y,'Herrenspiel überschneidet sich');continue}var px=pitchKey(x),py=pitchKey(y);if(px==='unbekannt'||py==='unbekannt'){mark(x,'Platzangabe fehlt');mark(y,'Platzangabe fehlt')}else if(px===py){mark(x,'Gleicher Platz überschneidet sich');mark(y,'Gleicher Platz überschneidet sich')}";
 const replacement="var px=pitchKey(x),py=pitchKey(y);if(px==='unbekannt'||py==='unbekannt'){mark(x,'Platzangabe fehlt');mark(y,'Platzangabe fehlt');continue}if(px!==py)continue;if(isMenGame(x)||isMenGame(y)){mark(x,'Herrenspiel auf gleichem Platz überschneidet sich');mark(y,'Herrenspiel auf gleichem Platz überschneidet sich')}else{mark(x,'Gleicher Platz überschneidet sich');mark(y,'Gleicher Platz überschneidet sich')}";
 const count=source.split(old).length-1;
 if(count!==1){status.className='status bad';status.textContent='Sicherheitsabbruch: Es wurden '+count+' passende Stellen gefunden.';return;}
 const output=source.replace(old,replacement);
 const blob=new Blob([output],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 status.className='status ok';status.textContent='Vollständige korrigierte index.html wurde heruntergeladen.';
};
</script>
</body>
</html>
