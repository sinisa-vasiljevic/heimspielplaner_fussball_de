name: FUSSBALL.DE Spielplan synchronisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: fussball-de-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Zehn feste Mannschaftsspielpläne abrufen
        run: python scripts/sync_fussball_de.py
      - name: JSON veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spiele-live.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Spielplan automatisch aktualisiert"
            git push
          fi
