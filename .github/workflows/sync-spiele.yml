name: FUSSBALL.DE Spielplan sicher synchronisieren und Pages bereitstellen

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fussball-de-sync-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright installieren
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade playwright

      - name: Chromium und System-Abhängigkeiten installieren
        run: python -m playwright install --with-deps chromium

      - name: Bisherigen Spielbestand sichern
        run: cp spiele-live.json /tmp/spiele-live-vorher.json

      - name: Zehn feste Mannschaftsspielpläne abrufen
        run: python scripts/sync_fussball_de.py

      - name: Vollständigkeit und JSON-Struktur prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old = json.loads(Path('/tmp/spiele-live-vorher.json').read_text(encoding='utf-8'))
          new = json.loads(Path('spiele-live.json').read_text(encoding='utf-8'))

          assert isinstance(new.get('games'), list), 'games fehlt oder ist keine Liste'

          old_games = [g for g in old.get('games', []) if g.get('id')]
          new_games = [g for g in new.get('games', []) if g.get('id')]
          old_ids = {g['id'] for g in old_games}
          new_ids = {g['id'] for g in new_games}

          # Alte Spiele, die bereits als abgesetzt bekannt waren, duerfen nach
          # der neuen Synchronisierung fehlen. Alle anderen alten Spiele bleiben
          # weiterhin durch die Vollstaendigkeitspruefung geschuetzt.
          allowed_removed_ids = {
              g['id'] for g in old_games
              if str(g.get('status', '')).strip().lower() == 'abgesetzt'
          }
          missing = sorted((old_ids - new_ids) - allowed_removed_ids)

          if missing:
              raise SystemExit(
                  f'ABBRUCH: {len(missing)} nicht-abgesetzte bisherige Spiele fehlen: {missing[:20]}'
              )

          invalid_cancelled = [
              g.get('id') for g in new_games
              if str(g.get('status', '')).strip().lower() == 'abgesetzt'
          ]
          if invalid_cancelled:
              raise SystemExit(
                  f'ABBRUCH: Abgesetzte Spiele stehen noch in neuer JSON: {invalid_cancelled[:20]}'
              )

          if len(new_ids) != len(new_games):
              raise SystemExit('ABBRUCH: doppelte oder ungültige Spiel-IDs')

          removed_cancelled = sorted((old_ids - new_ids) & allowed_removed_ids)
          print(
              f'Prüfung OK: vorher {len(old_ids)}, jetzt {len(new_ids)}, '
              f'{len(removed_cancelled)} bekannte Absetzungen entfernt, '
              'kein nicht-abgesetztes bisheriges Spiel verloren.'
          )
          if removed_cancelled:
              print('Entfernte Absetzungen:', removed_cancelled[:20])
          print('Mannschaftszähler:', new.get('counts', {}))
          PY

      - name: Validierte JSON konfliktfest in main speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add spiele-live.json

          if git diff --cached --quiet; then
            echo "Keine JSON-Änderung."
          else
            git commit -m "Spielplan sicher aktualisiert"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Neuesten main-Stand für Pages holen
        run: |
          git fetch origin main
          git reset --hard origin/main

          echo "Aktueller Commit:"
          git log -1 --oneline

          echo "spiel-aenderungen.json:"
          if [ -f spiel-aenderungen.json ]; then
            cat spiel-aenderungen.json
          else
            echo "FEHLER: spiel-aenderungen.json fehlt."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Exakt geprüften Stand auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
